[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "single-sensor-outage-imputer"
version = "0.1.0"
description = "TCDR runtime for single-sensor outage target imputation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "scikit-learn>=1.0.0",
  "torch>=1.9.0",
  "joblib>=1.0.0",
]

[project.urls]
Repository = "https://github.com/romulobrito/single-sensor-outage-imputer"

[tool.setuptools.packages.find]
include = ["ssoi*"]
